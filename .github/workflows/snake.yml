
name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *" # Atualiza a cada 6 horas
  workflow_dispatch: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: laizaerochar
          outputs: |
            dist/github-contribution-runner-snake.svg?color_snake=#C71585&color_dots=#ebedf0,#ffb6c1,#ff69b4,#ff1493,#C71585
            dist/github-contribution-runner-snake-dark.svg?palette=github-dark&color_snake=#C71585&color_dots=#161b22,#800040,#b30059,#e60073,#ff007f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
